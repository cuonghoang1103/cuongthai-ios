name: CuongThaiApp
options:
  bundleIdPrefix: com.cuongthai
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "30"
    # Mã đội lấy từ chính chứng thư Developer ID (OU=UR32PFUQ38), không phải
    # gõ tay từ trang web — đỡ một chỗ sai chính tả im lặng.
    DEVELOPMENT_TEAM: "UR32PFUQ38"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: "8.0.0"
  # Máy chủ chạy socket.io 4.8.3 — dòng 16.x của client là dòng nói được
  # giao thức Engine.IO v4. Dùng 15.x là bắt tay xong rồi ngắt ngay, và lỗi
  # hiện ra dạng "disconnect" trơn chứ không nói vì sao.
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: "16.1.0"
  # Đăng nhập Google. CHỈ gắn cho target iOS: bản macOS cần một luồng khác
  # (NSWindow thay UIViewController) và chưa làm.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "8.0.0"
  # WebRTC cho gọi thoại. Apple KHÔNG có bộ này trong SDK — chỉ cho CallKit
  # (màn hình gọi) và PushKit (đánh thức app), còn phần truyền tiếng nói phải
  # tự lo. `stasel/WebRTC` là bản dựng sẵn của Google đóng thành XCFramework;
  # tự dựng từ nguồn mất hàng giờ và cần depot_tools.
  #
  # ⚠️ ~30MB. Đó là lý do iOS tốn công gấp mấy lần web/desktop — hai cái kia
  # có WebRTC sẵn trong trình duyệt.
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "125.0.0"

targets:
  CuongThaiApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CuongThaiApp/Shared
        group: Shared
      - path: CuongThaiApp/iOS
        group: iOS
      - path: CuongThaiApp/Resources
        group: Resources
    settings:
      configs:
        # Không đặt thì Xcode lấy mặc định cũ `CODE_SIGN_IDENTITY = iPhone
        # Developer`, và khi dựng bản nộp nó đi tìm hồ sơ DEVELOPMENT — thứ đòi
        # phải có thiết bị đăng ký sẵn. Lỗi báo ra là "Your team has no devices
        # from which to generate a provisioning profile", đọc xong dễ tưởng
        # phải cắm iPhone vào mới nộp được app.
        Release:
          # Ký TỰ ĐỘNG thì KHÔNG được tự chỉ định chứng thư — Xcode báo
          # "conflicting provisioning settings". Chỉ cần nói rõ đây là bản
          # phát hành, Xcode tự chọn Apple Distribution.
          CODE_SIGN_STYLE: Automatic
        Debug:
          # ⚠️ `DEBUG` PHẢI khai ở ĐÂY, không được để trong `base`.
          #
          # Để trong `base` thì nó áp cho MỌI cấu hình, kể cả Release — nên
          # `#if DEBUG` đúng cả trong bản TestFlight. Hậu quả thật (20/08/2026):
          # app báo về máy chủ `sandbox: true`, backend gửi thông báo tới máy
          # chủ APNs THỬ NGHIỆM, trong khi bản TestFlight ký bằng
          # `aps-environment: production`. Sai máy chủ ⇒ Apple im lặng không
          # giao, và không có lỗi nào ở bất kỳ đâu để thấy.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.app
        INFOPLIST_FILE: CuongThaiApp/iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # CHỈ iPhone ("1"). Khai thêm iPad ("1,2") kéo theo hai hệ quả:
        #  1. App Store bắt khai ĐỦ 4 hướng màn hình, kể cả lộn ngược — nếu
        #     không, gói bị từ chối ngay ở bước kiểm (đã dính 20/08/2026).
        #  2. Quan trọng hơn: reviewer sẽ MỞ APP TRÊN iPad. Giao diện này dựng
        #     cho điện thoại (thanh 5 tab, bảng tin một cột), phóng lên iPad
        #     nhìn rất trống — đúng thứ bị đánh theo 2.1/4.2.
        # App vẫn chạy trên iPad ở chế độ tương thích. Muốn hỗ trợ iPad thật
        # thì đổi lại "1,2" VÀ dựng bố cục riêng cho màn rộng.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    dependencies:
      - package: Kingfisher
      - package: SocketIO
        product: SocketIO
      - package: WebRTC
        product: WebRTC
      - package: GoogleSignIn
        product: GoogleSignIn
      # Nút dựng sẵn đúng nhận diện thương hiệu Google. Tự vẽ lại chữ G bốn
      # màu là vi phạm quy định thương hiệu của họ, mà vẽ sai thì trông rẻ tiền.
      - package: GoogleSignIn
        product: GoogleSignInSwift
    entitlements:
      path: CuongThaiApp/iOS/CuongThaiApp.entitlements
      properties:
        # app-sandbox + network.client đã GỠ: đó là khoá của macOS. App iOS
        # luôn chạy trong hộp cát và mạng không cần entitlement; khai thừa chỉ
        # tổ làm bước cấp phép hồ sơ ký thất bại.
        #
        # App Store Guideline 4.8 — bắt buộc vì backend cũng có Google/GitHub.
        # Nhớ bật "Sign in with Apple" cho App ID trong Developer portal, không
        # thì build trượt bước provisioning.
        com.apple.developer.applesignin: [Default]
        # SDK Google ghi Keychain qua GTMAppAuth và đòi nhóm truy cập Keychain.
        keychain-access-groups: ["$(AppIdentifierPrefix)com.cuongthai.app"]
        # Thông báo đẩy. `development` cho bản chạy từ Xcode, và Apple TỰ ĐỔI
        # sang production khi đóng gói App Store / TestFlight — nên để
        # `development` ở đây là đúng cho cả hai, không phải sửa mỗi lần.
        # Thiếu khoá này thì `registerForRemoteNotifications()` gọi xong im
        # lặng, không có thẻ nào về, và không có lỗi nào để thấy.
        aps-environment: development

  CuongThaiAppMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CuongThaiApp/Shared
        group: Shared
      - path: CuongThaiApp/macOS
        group: macOS
      - path: CuongThaiApp/Resources
        group: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.app.macos
        INFOPLIST_FILE: CuongThaiApp/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_NAME: "CuongThai App"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    dependencies:
      - package: Kingfisher
      - package: SocketIO
        product: SocketIO
    entitlements:
      path: CuongThaiApp/macOS/CuongThaiAppMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

schemes:
  CuongThaiApp:
    build:
      targets:
        CuongThaiApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CuongThaiAppMac:
    build:
      targets:
        CuongThaiAppMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
