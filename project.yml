name: CuongThaiApp
options:
  bundleIdPrefix: com.cuongthai
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "39"
    # Mã đội lấy từ chính chứng thư Developer ID (OU=UR32PFUQ38), không phải
    # gõ tay từ trang web — đỡ một chỗ sai chính tả im lặng.
    DEVELOPMENT_TEAM: "UR32PFUQ38"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: "8.0.0"
  # Máy chủ chạy socket.io 4.8.3 — dòng 16.x của client là dòng nói được
  # giao thức Engine.IO v4. Dùng 15.x là bắt tay xong rồi ngắt ngay, và lỗi
  # hiện ra dạng "disconnect" trơn chứ không nói vì sao.
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: "16.1.0"
  # Đăng nhập Google. CHỈ gắn cho target iOS: bản macOS cần một luồng khác
  # (NSWindow thay UIViewController) và chưa làm.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "8.0.0"
  # WebRTC cho gọi thoại. Apple KHÔNG có bộ này trong SDK — chỉ cho CallKit
  # (màn hình gọi) và PushKit (đánh thức app), còn phần truyền tiếng nói phải
  # tự lo. `stasel/WebRTC` là bản dựng sẵn của Google đóng thành XCFramework;
  # tự dựng từ nguồn mất hàng giờ và cần depot_tools.
  #
  # ⚠️ ~30MB. Đó là lý do iOS tốn công gấp mấy lần web/desktop — hai cái kia
  # có WebRTC sẵn trong trình duyệt.
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "125.0.0"

targets:
  CuongThaiApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CuongThaiApp/Shared
        group: Shared
      - path: CuongThaiApp/iOS
        group: iOS
      - path: CuongThaiApp/Resources
        group: Resources
    settings:
      configs:
        # Không đặt thì Xcode lấy mặc định cũ `CODE_SIGN_IDENTITY = iPhone
        # Developer`, và khi dựng bản nộp nó đi tìm hồ sơ DEVELOPMENT — thứ đòi
        # phải có thiết bị đăng ký sẵn. Lỗi báo ra là "Your team has no devices
        # from which to generate a provisioning profile", đọc xong dễ tưởng
        # phải cắm iPhone vào mới nộp được app.
        Release:
          # Ký TỰ ĐỘNG thì KHÔNG được tự chỉ định chứng thư — Xcode báo
          # "conflicting provisioning settings". Chỉ cần nói rõ đây là bản
          # phát hành, Xcode tự chọn Apple Distribution.
          CODE_SIGN_STYLE: Automatic
        Debug:
          # ⚠️ `DEBUG` PHẢI khai ở ĐÂY, không được để trong `base`.
          #
          # Để trong `base` thì nó áp cho MỌI cấu hình, kể cả Release — nên
          # `#if DEBUG` đúng cả trong bản TestFlight. Hậu quả thật (20/08/2026):
          # app báo về máy chủ `sandbox: true`, backend gửi thông báo tới máy
          # chủ APNs THỬ NGHIỆM, trong khi bản TestFlight ký bằng
          # `aps-environment: production`. Sai máy chủ ⇒ Apple im lặng không
          # giao, và không có lỗi nào ở bất kỳ đâu để thấy.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.app
        INFOPLIST_FILE: CuongThaiApp/iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # iPhone + iPad ("1,2") — mở 16/09/2026. Hai điều kiện đi KÈM, thiếu
        # một cái là quay lại đúng hai lý do từng khiến nó bị khoá ở "1":
        #  1. `Info.plist` phải có `UISupportedInterfaceOrientations~ipad` với
        #     ĐỦ 4 hướng, kể cả lộn ngược. Thiếu ⇒ gói bị từ chối ngay ở bước
        #     kiểm, không đợi tới reviewer (đã dính 20/08/2026).
        #  2. Phải có bố cục riêng cho màn rộng, nếu không reviewer mở trên
        #     iPad thấy thanh 5 tab phóng to và đánh theo 2.1/4.2. Bố cục đó
        #     là `BoCucCotDoi` trong `ContentView.swift`, chọn theo
        #     `horizontalSizeClass` chứ không theo hệ điều hành — nên iPad
        #     ngang và macOS dùng CHUNG một đường, còn iPad trong Slide Over
        #     hẹp tự rơi về thanh tab của iPhone.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    dependencies:
      # ⚠️ PHẢI nằm trong ĐÚNG khối `dependencies` này. Khai thành một khối
      # `dependencies:` thứ hai trong cùng target thì YAML giữ khoá SAU và
      # nuốt khoá trước — xcodegen chạy xanh, xcodebuild chạy xanh, và app
      # ra lò KHÔNG có thư mục `PlugIns`. Không một dòng cảnh báo nào.
      - target: TienWidget
        embed: true
      # Share Extension: "Chia sẻ → CuongThai" từ app YouTube/TikTok.
      # ⚠️ Nằm TRONG khối này, không mở khối `dependencies:` thứ hai.
      - target: ChiaSeVideo
        embed: true
      - package: Kingfisher
      - package: SocketIO
        product: SocketIO
      - package: WebRTC
        product: WebRTC
      - package: GoogleSignIn
        product: GoogleSignIn
      # Nút dựng sẵn đúng nhận diện thương hiệu Google. Tự vẽ lại chữ G bốn
      # màu là vi phạm quy định thương hiệu của họ, mà vẽ sai thì trông rẻ tiền.
      - package: GoogleSignIn
        product: GoogleSignInSwift
    entitlements:
      path: CuongThaiApp/iOS/CuongThaiApp.entitlements
      properties:
        # app-sandbox + network.client đã GỠ: đó là khoá của macOS. App iOS
        # luôn chạy trong hộp cát và mạng không cần entitlement; khai thừa chỉ
        # tổ làm bước cấp phép hồ sơ ký thất bại.
        #
        # App Store Guideline 4.8 — bắt buộc vì backend cũng có Google/GitHub.
        # Nhớ bật "Sign in with Apple" cho App ID trong Developer portal, không
        # thì build trượt bước provisioning.
        com.apple.developer.applesignin: [Default]
        # SDK Google ghi Keychain qua GTMAppAuth và đòi nhóm truy cập Keychain.
        keychain-access-groups: ["$(AppIdentifierPrefix)com.cuongthai.app"]
        # ⚠️ App Group PHẢI khai Ở ĐÂY, không phải sửa tay vào tệp
        # `.entitlements` — XcodeGen SINH LẠI tệp đó từ khối này mỗi lần chạy
        # `xcodegen generate`, nên sửa tay là bị ghi đè im lặng. Đo thật
        # 19/09/2026: thêm vào tệp, dựng xanh, mà `codesign -d` của app KHÔNG
        # có group, trong khi widget thì có — widget đọc được vùng chung còn
        # app ghi vào chỗ khác, tức là widget vĩnh viễn trống.
        #
        # Chuỗi phải TRÙNG KHÍT với `KhoAnhChupTien.nhom` và với
        # `Widget/Widget.entitlements`.
        com.apple.security.application-groups: ["group.com.cuongthai.app"]
        # Thông báo đẩy. `development` cho bản chạy từ Xcode, và Apple TỰ ĐỔI
        # sang production khi đóng gói App Store / TestFlight — nên để
        # `development` ở đây là đúng cho cả hai, không phải sửa mỗi lần.
        # Thiếu khoá này thì `registerForRemoteNotifications()` gọi xong im
        # lặng, không có thẻ nào về, và không có lỗi nào để thấy.
        aps-environment: development

  # ─── App QUẢN TRỊ (nội bộ, chỉ iPad) ────────────────────────────────
  #
  # App RIÊNG (bundle khác, biểu tượng riêng trên máy) nhưng nằm CHUNG
  # project để dùng lại tầng mạng: `Shared/Network` + `Shared/Models` +
  # `Shared/Storage` + `Shared/Theme.swift` — 3.288 dòng, đo 16/09/2026 là
  # KHÔNG file nào import SwiftUI nên tách sạch. Sửa `APIEndpoint` một lần,
  # cả hai app cùng có.
  #
  # ⚠️ KHÔNG nộp App Store: nó cài thẳng bằng `devicectl`. Vì thế bỏ được
  # Sign in with Apple, xoá tài khoản trong app, báo cáo/chặn, màn đồng ý
  # quy tắc — toàn bộ khối tuân thủ mà app chính phải mang.
  # ⚠️ Đổi lại: hồ sơ ký kiểu development hết hạn khoảng một năm, tới lúc đó
  # app không mở được nữa cho tới khi cài lại. Dữ liệu không mất.
  # ─── Widget Tiền nong ──────────────────────────────────────────
  # ⚠️ Chỉ nạp ĐÚNG một tệp mã của app (`AnhChupTien.swift`). Kéo cả
  # `Shared` vào đây là lôi theo socket, Kingfisher, SwiftData… vào một
  # extension chỉ được cấp vài chục MB — nó bị hệ thống giết và widget
  # hiện ô trống, không có lỗi nào để thấy.
  TienWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CuongThaiApp/Widget
      - path: CuongThaiApp/Shared/Tien/AnhChupTien.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.app.TienWidget
        INFOPLIST_FILE: CuongThaiApp/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CuongThaiApp/Widget/Widget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "UR32PFUQ38"

  # ─── Share Extension: nhận link video chia sẻ từ app khác ─────
  # ⚠️ KHÔNG kéo `Shared` vào đây. Extension chia sẻ chỉ được cấp vài chục
  # MB; lôi socket/Kingfisher/SwiftData vào là bị hệ thống giết và ô chia sẻ
  # biến mất khỏi khay, không có lỗi nào để thấy. Nó chỉ cần UIKit.
  ChiaSeVideo:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CuongThaiApp/ChiaSe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.app.ChiaSeVideo
        INFOPLIST_FILE: CuongThaiApp/ChiaSe/Info.plist
        CODE_SIGN_ENTITLEMENTS: CuongThaiApp/ChiaSe/ChiaSe.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "UR32PFUQ38"

  CuongThaiAdmin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # ⚠️ KHÔNG khai `group:` ở đây. Nhóm cha `CuongThaiApp` trong project đã
    # mang `path = CuongThaiApp`; khai thêm group khiến xcodegen ghi đường dẫn
    # đầy đủ vào nhóm con nữa và Xcode đi tìm `CuongThaiApp/CuongThaiApp/Admin`
    # — lỗi "Build input files cannot be found", nghe như thiếu file.
    sources:
      - path: CuongThaiApp/Admin
        # Nguồn app quản trị KHÔNG nằm trong kho công khai. `optional` để bản
        # clone từ GitHub vẫn `xcodegen generate` được (chỉ scheme này hỏng).
        optional: true
      - path: CuongThaiApp/Shared/Network
      - path: CuongThaiApp/Shared/Models
      - path: CuongThaiApp/Shared/Storage
      - path: CuongThaiApp/Shared/Theme.swift
      # `Models.swift` gọi `Date.tuChuoiISO` — extension nằm ở đây, chỉ
      # `import Foundation` nên kéo theo không tốn gì.
      - path: CuongThaiApp/Shared/Extensions/TimeFormatter.swift
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.admin
        INFOPLIST_FILE: CuongThaiApp/Admin/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Biểu tượng RIÊNG (Admin/Assets.xcassets) — ba cột số liệu trên nền
        # tím-đen. Không dùng chung `AppIcon` của app chính: hai app nằm cạnh
        # nhau trên màn hình iPad, trùng biểu tượng là mở nhầm mỗi ngày.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CHỈ iPad. App này sống trên bàn làm việc, không phải trong túi —
        # bày số liệu và bảng đơn hàng trên màn 5 inch là vô nghĩa.
        TARGETED_DEVICE_FAMILY: "2"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES

  # ─── App CT WORK riêng (nộp App Store, iPhone + iPad) — 17/10/2026 ──────
  #
  # Bundle riêng `com.cuongthai.ctwork`, biểu tượng riêng, Info.plist riêng,
  # bản khai quyền riêng tư riêng. Dùng lại tầng mạng + module `Shared/CTWork`
  # của app chính, nhưng CHỈ kéo đúng những tệp cần — KHÔNG kéo cả `Shared`:
  #   · kéo cả `Shared` là kéo theo WebRTC/micro/vị trí/nhận giọng nói… ⇒ Apple
  #     quét nhị phân thấy API quyền riêng tư mà Info.plist không khai chuỗi
  #     mục đích (ITMS-90683), và reviewer thấy một app "nhân bản" app chính (4.3).
  #   · `AppState` của app này là lớp RIÊNG (`CTWorkApp/App/AppStateCTW.swift`) cùng
  #     tên và cùng các thành viên mà `Shared/CTWork` đọc (`currentUser`,
  #     `ctWorkDich`) — tệp `ViewModels/AppState.swift` của app chính KHÔNG vào đây.
  # ⚠️ Không khai `group:` (xem chú thích ở CuongThaiAdmin).
  # ⚠️ Thêm tệp `Shared` mới mà `Shared/CTWork` cần ⇒ thêm vào danh sách dưới,
  #    không thì lỗi hiện ra dạng "cannot find X in scope".
  CTWorkApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Số phiên bản chung với widget + Share Extension (ITMS-90473) — CuongThaiApp/CTWorkApp/PhienBanCTW.xcconfig.
    configFiles:
      Debug: CuongThaiApp/CTWorkApp/PhienBanCTW.xcconfig
      Release: CuongThaiApp/CTWorkApp/PhienBanCTW.xcconfig
    sources:
      - path: CuongThaiApp/CTWorkApp
        # Tài liệu kiến trúc + xcconfig KHÔNG được chép vào gói app.
        excludes: ["**/*.md", "**/*.xcconfig"]
      # Kiểu dùng chung với widget + Share Extension (App Group, Keychain chia sẻ, Live Activity).
      - path: CuongThaiApp/CTWorkShared
      - path: CuongThaiApp/Shared/CTWork
      - path: CuongThaiApp/Shared/Network
      - path: CuongThaiApp/Shared/Models
      - path: CuongThaiApp/Shared/Storage/KeychainStore.swift
      - path: CuongThaiApp/Shared/Storage/StorageManager.swift
      - path: CuongThaiApp/Shared/Theme.swift
      - path: CuongThaiApp/Shared/Extensions/TimeFormatter.swift
      - path: CuongThaiApp/Shared/NgoaiTuyen/KhoNgoaiTuyen.swift
      - path: CuongThaiApp/Shared/Services/ModerationStore.swift
      - path: CuongThaiApp/Shared/Auth/AppleSignIn.swift
      - path: CuongThaiApp/Shared/Components/UserAvatarView.swift
      # Máy ảnh (UIImagePickerController) — tự đứng, chỉ UIKit.
      - path: CuongThaiApp/Shared/Views/MayAnh.swift
    settings:
      configs:
        Debug:
          # ⚠️ Chỉ ở Debug — xem chú thích ở target CuongThaiApp (cờ DEBUG lọt
          # vào Release làm push đi nhầm máy chủ APNs thử nghiệm).
          # CTWORK_APP: bảng màu theo web CT Work (Shared/Theme.swift) — chỉ app CT Work riêng, app chính giữ tím.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG CTWORK_APP
        Release:
          CODE_SIGN_STYLE: Automatic
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CTWORK_APP
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.ctwork
        PRODUCT_NAME: CTWork
        INFOPLIST_FILE: CuongThaiApp/CTWorkApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # ⚠️ KHÔNG khai MARKETING_VERSION / CURRENT_PROJECT_VERSION ở đây: khai ở target sẽ ĐÈ xcconfig
        # và app lệch số với extension. Sửa ở PhienBanCTW.xcconfig.
        # iPhone + iPad. iPad có bố cục RIÊNG (NavigationSplitView thanh bên theo nhóm ở
        # `CTWorkApp/App/KhungCTW.swift`), Info.plist khai đủ 4 hướng cho iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    dependencies:
      # ⚠️ MỘT khối `dependencies:` duy nhất (khai hai khối ⇒ YAML nuốt khối trước, app ra lò thiếu PlugIns).
      - target: CTWorkWidget
        embed: true
      - target: CTWorkShare
        embed: true
      - package: Kingfisher
      - package: SocketIO
        product: SocketIO
    entitlements:
      path: CuongThaiApp/CTWorkApp/CTWorkApp.entitlements
      properties:
        # Mảng D: vùng chung với widget + Share Extension. Chuỗi TRÙNG KHÍT `NhomCTW.appGroup`
        # và entitlements của hai extension dưới. Bật "App Groups" cho cả ba App ID ở Developer portal.
        com.apple.security.application-groups: ["group.com.cuongthai.ctwork"]
        # Keychain: nhóm ĐẦU = nhóm mặc định (giữ bằng App ID như trước để token cũ vẫn đọc được);
        # nhóm thứ hai chia token cho Share Extension (`TokenNhomCTW`, Info.plist `CTWNhomKeychain`).
        keychain-access-groups: ["$(AppIdentifierPrefix)com.cuongthai.ctwork", "$(AppIdentifierPrefix)com.cuongthai.ctwork.shared"]
        # 4.8: bắt buộc bật "Sign in with Apple" cho App ID com.cuongthai.ctwork
        # trong Developer portal, không thì bước ký hồ sơ trượt.
        com.apple.developer.applesignin: [Default]
        # Thông báo đẩy — Apple tự đổi sang production khi đóng gói TestFlight.
        aps-environment: development
        # Universal Link https://cuongthai.com/work/... — chỉ có tác dụng khi
        # máy chủ phục vụ apple-app-site-association có appID của app này
        # (xem CTWORK_APP_REVIEW_NOTES.md, phần backend còn thiếu).
        com.apple.developer.associated-domains: ["applinks:cuongthai.com"]

  # ─── Widget + Live Activity của app CT Work (mảng D, 18/10/2026) ───────
  # "My work today", "Timer", Live Activity đồng hồ (Lock Screen + Dynamic Island).
  # ⚠️ CHỈ `CTWorkShared/` — KHÔNG kéo `Shared/` (socket/Kingfisher… ⇒ vượt bộ nhớ extension, widget trống câm).
  # Widget không gọi mạng, không cầm token: đọc ảnh chụp JSON app ghi vào App Group.
  CTWorkWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: CuongThaiApp/CTWorkApp/PhienBanCTW.xcconfig
      Release: CuongThaiApp/CTWorkApp/PhienBanCTW.xcconfig
    sources:
      - path: CuongThaiApp/CTWorkWidget
      - path: CuongThaiApp/CTWorkShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.ctwork.widget
        INFOPLIST_FILE: CuongThaiApp/CTWorkWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "UR32PFUQ38"
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: CuongThaiApp/CTWorkWidget/CTWorkWidget.entitlements
      properties:
        com.apple.security.application-groups: ["group.com.cuongthai.ctwork"]

  # ─── Share Extension của app CT Work (mảng D) ─────────────────────────
  # Ảnh / link / chữ từ app khác ⇒ tạo thẻ hoặc bình luận vào thẻ đã xem gần đây. TỰ gọi API bằng token
  # trong Keychain chia sẻ. ⚠️ Không kéo `Shared/`.
  CTWorkShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: CuongThaiApp/CTWorkApp/PhienBanCTW.xcconfig
      Release: CuongThaiApp/CTWorkApp/PhienBanCTW.xcconfig
    sources:
      - path: CuongThaiApp/CTWorkShare
      # Chỉ tệp App Group/Keychain — tệp Live Activity (ActivityKit/AppIntents) không cần ở đây.
      - path: CuongThaiApp/CTWorkShared/NhomCTW.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.ctwork.share
        INFOPLIST_FILE: CuongThaiApp/CTWorkShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "UR32PFUQ38"
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: CuongThaiApp/CTWorkShare/CTWorkShare.entitlements
      properties:
        com.apple.security.application-groups: ["group.com.cuongthai.ctwork"]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.cuongthai.ctwork.shared"]

  # Kiểm thử của app CT Work: đơn vị (giải mã dữ liệu mẫu đúng hình dạng
  # backend, bộ tách đường dẫn, markdown, bảng đăng ký mô-đun) + giao diện
  # (bấm thật trên máy mô phỏng với máy chủ giả `CT_XEM_MAN`).
  CTWorkAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CuongThaiApp/CTWorkTests
    dependencies:
      - target: CTWorkApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.ctwork.tests
        GENERATE_INFOPLIST_FILE: YES
        # PRODUCT_NAME của app là `CTWork` (không phải tên target) ⇒ khai tay.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CTWork.app/CTWork
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "UR32PFUQ38"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG

  CTWorkAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CuongThaiApp/CTWorkUITests
    dependencies:
      - target: CTWorkApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.ctwork.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "UR32PFUQ38"
        TEST_TARGET_NAME: CTWorkApp

  CuongThaiAppMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CuongThaiApp/Shared
        group: Shared
      - path: CuongThaiApp/macOS
        group: macOS
      - path: CuongThaiApp/Resources
        group: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuongthai.app.macos
        INFOPLIST_FILE: CuongThaiApp/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_NAME: "CuongThai App"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    dependencies:
      - package: Kingfisher
      - package: SocketIO
        product: SocketIO
    entitlements:
      path: CuongThaiApp/macOS/CuongThaiAppMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

schemes:
  CuongThaiApp:
    build:
      targets:
        CuongThaiApp: all
    run:
      config: Debug
      # Cho phép chạy thử luồng mua Pro NGAY trên máy, không cần hợp đồng
      # Paid Applications hay sản phẩm trên App Store Connect. StoreKit đọc
      # bảng giá từ file này khi chạy bằng scheme Debug.
      # ⚠️ CHỈ ảnh hưởng lúc chạy từ Xcode/scheme — bản archive không dùng nó.
      storeKitConfiguration: CuongThaiApp/Pro.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CTWorkApp:
    build:
      targets:
        CTWorkApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CTWorkAppTests
        - CTWorkAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CuongThaiAppMac:
    build:
      targets:
        CuongThaiAppMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
